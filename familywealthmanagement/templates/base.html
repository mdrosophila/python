<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Family Wealth Management{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    nav { display: flex; gap: .25rem; padding: 0 2rem; background: #1f3a5f; }
    nav a { color: #cfd8e6; text-decoration: none; padding: .8rem 1.2rem; }
    nav a:hover { background: #2c4d7c; color: #fff; }
    nav a.active { background: #fff; color: #1f3a5f; font-weight: 600; }
    nav a.brand { color: #fff; font-weight: 700; padding-left: 0; margin-right: 1rem; }
    nav a.brand:hover { background: none; }
    nav .spacer { flex: 1; }
    nav form { display: flex; align-items: center; margin: 0; }
    nav button { background: none; border: 0; color: #cfd8e6; cursor: pointer; font: inherit; padding: .8rem 1.2rem; }
    nav button:hover { background: #2c4d7c; color: #fff; }
    main { margin: 2rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'home' %}">Family Wealth Management</a>
    <a href="{% url 'annualized_return' %}" {% if request.resolver_match.url_name == 'annualized_return' %}class="active"{% endif %}>Benchmark</a>
    <a href="{% url 'asset_simulation' %}" {% if request.resolver_match.url_name == 'asset_simulation' %}class="active"{% endif %}>Simulation</a>
    <a href="{% url 'ips_list' %}" {% if request.resolver_match.app_name == '' and 'ips' in request.resolver_match.url_name %}class="active"{% endif %}>IPS</a>
    <span class="spacer"></span>
    {% if user.is_authenticated %}
      <a href="{% url 'profile' %}">{{ user.username }}</a>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

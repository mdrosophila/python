{% extends "base.html" %}

{% block title %}My details{% endblock %}

{% block head %}
  <style>
    form { max-width: 480px; }
    .field { margin-bottom: .8rem; }
    .field label { display: block; font-size: .9rem; margin-bottom: .2rem; }
    .field input, .field textarea { width: 100%; box-sizing: border-box; padding: 4px; }
    .help { color: #666; font-size: .8rem; }
    .errorlist { color: #b00020; margin: .2rem 0; padding-left: 1.2rem; }
  </style>
{% endblock %}

{% block content %}
  <h1>My details</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}{% include "ips/_field.html" %}{% endfor %}
    <button type="submit">Save</button>
  </form>
{% endblock %}
